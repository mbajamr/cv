<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <defs>
    <!-- Mask to punch out the three dots (More/Ellipsis menu) with matching bold styling -->
    <mask id="ellipsis-mask">
      <!-- Everything white stays visible -->
      <rect x="0" y="0" width="100" height="100" fill="#ffffff" />
      
      <!-- Black circles cut through to create bold transparent dots -->
      <g fill="#000000">
        <!-- Left dot -->
        <circle cx="34" cy="50" r="5" />
        <!-- Center dot -->
        <circle cx="50" cy="50" r="5" />
        <!-- Right dot -->
        <circle cx="66" cy="50" r="5" />
      </g>
    </mask>
  </defs>

  <!-- White base circle with the transparent ellipsis mask applied -->
  <circle cx="50" cy="50" r="50" fill="#ffffff" mask="url(#ellipsis-mask)" />
</svg>