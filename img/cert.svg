<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <defs>
    <!-- Mask to punch out the certificate shape with matching bold styling -->
    <mask id="certificate-mask">
      <!-- Everything white stays visible -->
      <rect x="0" y="0" width="100" height="100" fill="#ffffff" />
      
      <!-- Black elements cut through to create bold transparency -->
      <g fill="none" stroke="#000000" stroke-width="6" stroke-linecap="round" stroke-linejoin="round">
        <!-- Main Certificate Document Frame -->
        <rect x="26" y="25" width="48" height="34" rx="4" />
        
        <!-- Document Text / Placeholder Lines on the right side -->
        <path d="M 58 35 L 66 35" />
        <path d="M 58 44 L 66 44" />
        
        <!-- Ribbon tails hanging from the badge -->
        <path d="M 37 62 L 37 73 L 42 68 L 47 73 L 47 62" />
        
        <!-- 8-Point Star Badge/Seal Overlapping the frame -->
        <!-- Formed cleanly with two overlapping rotated squares filled with black to clear the center -->
        <path d="M 33 49 L 42 40 L 51 49 L 42 58 Z" fill="#000000" />
        <path d="M 36 43 L 48 43 L 48 55 L 36 55 Z" fill="#000000" />
      </g>
    </mask>
  </defs>

  <!-- White base circle with the transparent certificate mask applied -->
  <circle cx="50" cy="50" r="50" fill="#ffffff" mask="url(#certificate-mask)" />
</svg>

