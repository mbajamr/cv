<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <!-- Outer circle made white, inner circle removed to keep background transparent -->
  <circle cx="50" cy="50" r="50" fill="#ffffff" />
  
  <!-- Camera icon group outlined in transparent/cutout style -->
  <!-- Note: Uses "destination-out" masking logic for true transparency inside the white circle -->
  <g fill="none" stroke="#ffffff" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round" style="mix-blend-mode: destination-out;">
    <!-- Outer camera body -->
    <path d="M 33 26 L 67 26 L 74 33 L 74 67 L 67 74 L 33 74 L 26 67 L 26 33 Z" />
    
    <!-- Central lens circle -->
    <circle cx="50" cy="50" r="14.5" />
    
    <!-- Camera flash/aperture dot -->
    <circle cx="66" cy="34" r="0.5" fill="#000000" stroke-width="3" />
  </g>
</svg>
