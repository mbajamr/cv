<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
<defs>
    <!-- Mask to punch out the graph shape, leaving it perfectly transparent -->
    <mask id="graph-mask">
      <!-- Everything white stays visible -->
      <rect x="0" y="0" width="100" height="100" fill="#ffffff" />
      <!-- Everything black cuts through to create transparency -->
      <g fill="none" stroke="#000000" stroke-width="6.5" stroke-linecap="round" stroke-linejoin="round">
        <!-- Axis (L-shape) -->
        <path d="M 28 26 L 28 72 L 74 72" />
        <!-- Line graph -->
        <path d="M 38 56 L 49 43 L 60 54 L 72 35" />
      </g>
    </mask>
  </defs>

  <!-- White base circle with the transparent graph mask applied -->
  <circle cx="50" cy="50" r="50" fill="#ffffff" mask="url(#graph-mask)" />
</svg>