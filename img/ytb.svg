<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <defs>
    <!-- Mask to punch out the video play button shape with matching bold styling -->
    <mask id="video-mask">
      <!-- Everything white stays visible -->
      <rect x="0" y="0" width="100" height="100" fill="#ffffff" />
      
      <!-- Black elements cut through to create bold transparency -->
      <g fill="none" stroke="#000000" stroke-width="6.5" stroke-linecap="round" stroke-linejoin="round">
        <!-- Main Screen / Tablet Frame -->
        <path d="M 32 28 L 68 28 L 74 34 L 74 66 L 68 72 L 32 72 L 26 66 L 26 34 Z" />
        
        <!-- Inner Play Triangle (Filled black to punch out completely) -->
        <path d="M 45 40 L 61 50 L 45 60 Z" fill="#000000" stroke="none" />
      </g>
    </mask>
  </defs>

  <!-- White base circle with the transparent video play mask applied -->
  <circle cx="50" cy="50" r="50" fill="#ffffff" mask="url(#video-mask)" />
</svg>
