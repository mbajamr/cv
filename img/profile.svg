<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <defs>
    <!-- Mask to punch out the enhanced user profile shape -->
    <mask id="enhanced-user-mask">
      <!-- Everything white stays visible -->
      <rect x="0" y="0" width="100" height="100" fill="#ffffff" />
      
      <!-- Black elements cut through to create bold transparency -->
      <!-- Increased stroke-width to 6.5 for cleaner visibility at small scales -->
      <g fill="none" stroke="#000000" stroke-width="6.5" stroke-linecap="round" stroke-linejoin="round">
        <!-- Head / Oval (Slightly adjusted proportions for balance) -->
        <rect x="40" y="25" width="20" height="25" rx="10" />
        
        <!-- Shoulders / Torso outline (Expanded down completely to sit beautifully inside the circle) -->
        <path d="M 28 68 C 28 58, 34 53, 42 53 L 58 53 C 66 53, 72 58, 72 68" />
      </g>
    </mask>
  </defs>

  <!-- White base circle with the bolder transparent profile mask applied -->
  <circle cx="50" cy="50" r="50" fill="#ffffff" mask="url(#enhanced-user-mask)" />
</svg>
