<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <defs>
    <!-- Mask to punch out the graduation cap shape with matching bold styling -->
    <mask id="graduation-mask">
      <!-- Everything white stays visible -->
      <rect x="0" y="0" width="100" height="100" fill="#ffffff" />
      
      <!-- Black elements cut through to create bold transparency -->
      <g fill="none" stroke="#000000" stroke-width="6.5" stroke-linecap="round" stroke-linejoin="round">
        <!-- Diamond top of the cap (Mortarboard) -->
        <path d="M 50 24 L 80 39 L 50 54 L 20 39 Z" />
        
        <!-- Lower skull cap / band beneath the diamond -->
        <path d="M 33 47.5 L 33 58 C 33 64, 67 64, 67 58 L 67 47.5" />
        
        <!-- Tassel hanging down the right side -->
        <path d="M 50 39 L 73 45 L 73 57" />
        
        <!-- Tassel fringe/bead dot at the end -->
        <circle cx="73" cy="62" r="0.5" fill="#000000" stroke-width="4.5" />
      </g>
    </mask>
  </defs>

  <!-- White base circle with the transparent graduation cap mask applied -->
  <circle cx="50" cy="50" r="50" fill="#ffffff" mask="url(#graduation-mask)" />
</svg>
