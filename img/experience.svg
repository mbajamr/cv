<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <defs>
    <!-- Mask to punch out the briefcase shape with matching bold styling -->
    <mask id="briefcase-mask">
      <!-- Everything white stays visible -->
      <rect x="0" y="0" width="100" height="100" fill="#ffffff" />
      
      <!-- Black elements cut through to create bold transparency -->
      <g fill="none" stroke="#000000" stroke-width="6.5" stroke-linecap="round" stroke-linejoin="round">
        <!-- Handle on top -->
        <path d="M 40 26 C 40 20, 60 20, 60 26" />
        
        <!-- Main Briefcase Body -->
        <rect x="25" y="32" width="50" height="36" rx="6" />
        
        <!-- Center Clasp / Lock Detail -->
        <rect x="46" y="47" width="8" height="10" rx="2" />
        
        <!-- Accent lines / Flap detailing on sides of clasp -->
        <path d="M 26 49 C 32 49, 36 53, 41 53" />
        <path d="M 74 49 C 68 49, 64 53, 59 53" />
      </g>
    </mask>
  </defs>

  <!-- White base circle with the transparent briefcase mask applied -->
  <circle cx="50" cy="50" r="50" fill="#ffffff" mask="url(#briefcase-mask)" />
</svg>
