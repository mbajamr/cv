<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <defs>
    <!-- Mask to punch out the LinkedIn 'in' shape with matching bold styling -->
    <mask id="linkedin-mask">
      <!-- Everything white stays visible -->
      <rect x="0" y="0" width="100" height="100" fill="#ffffff" />
      
      <!-- Black 'in' geometry cuts through to create smooth, bold transparency -->
      <g fill="#000000">
        <!-- Letter 'i' stem -->
        <rect x="25" y="38" width="10" height="34" />
        
        <!-- Letter 'i' dot -->
        <circle cx="30" cy="27" r="5.5" />
        
        <!-- Letter 'n' structure -->
        <path d="M 43 38 L 43 72 L 53 72 L 53 53.5 C 53 48.5, 55.5 45.5, 60 45.5 C 64.5 45.5, 66.5 48.5, 66.5 53.5 L 66.5 72 L 76.5 72 L 76.5 51 C 76.5 41.5, 71.5 36.5, 63 36.5 C 56.5 36.5, 51.5 40, 48.5 44 L 48.5 38 Z" />
      </g>
    </mask>
  </defs>

  <!-- White base circle with the transparent LinkedIn 'in' mask applied -->
  <circle cx="50" cy="50" r="50" fill="#ffffff" mask="url(#linkedin-mask)" />
</svg>
